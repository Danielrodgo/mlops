# pytest.ini  [Test runner settings]
[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
norecursedirs = notebooks data models reports logs wandb .git __pycache__

# Use disposable, repo-local test files instead of the system temp folder.
# pytest clears only this dedicated folder before each run.
# .gitignore must exclude .pytest_cache/ (checked in the next step).
addopts = -q --basetemp=.pytest_cache/pytest-tmp